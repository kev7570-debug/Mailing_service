<!DOCTYPE html>
<html>
<head>
    <title>Сервис управления рассылками</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <h1 class="text-center mb-4">Сервис управления рассылками</h1>
        <div class="row text-center">
            <div class="col-md-4">
                <div class="card">
                    <div class="card-body">
                        <h3>{{ total_mailings }}</h3>
                        <p>Всего рассылок</p>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card">
                    <div class="card-body">
                        <h3>{{ active_mailings }}</h3>
                        <p>Активных рассылок</p>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card">
                    <div class="card-body">
                        <h3>{{ unique_clients }}</h3>
                        <p>Уникальных получателей</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
