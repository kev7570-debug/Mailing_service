{% extends 'base.html' %}

{% block title %}{{ client.full_name }}{% endblock %}

{% block content %}
<div class="card">
    <div class="card-header">
        <h3>{{ client.full_name }}</h3>
    </div>
    <div class="card-body">
        <p><strong>Email:</strong> {{ client.email }}</p>
        <p><strong>Комментарий:</strong> {{ client.comment|default:"Нет комментария" }}</p>
    </div>
    <div class="card-footer">
        <a href="{% url 'mailing:client_update' client.pk %}" class="btn btn-warning">Редактировать</a>
        <a href="{% url 'mailing:client_delete' client.pk %}" class="btn btn-danger">Удалить</a>
        <a href="{% url 'mailing:client_list' %}" class="btn btn-secondary">Назад</a>
    </div>
</div>
{% endblock %}
