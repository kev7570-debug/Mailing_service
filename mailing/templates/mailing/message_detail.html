{% extends 'base.html' %}

{% block title %}{{ message.subject }}{% endblock %}

{% block content %}
<div class="card">
    <div class="card-header">
        <h3>{{ message.subject }}</h3>
    </div>
    <div class="card-body">
        <p><strong>Тема:</strong> {{ message.subject }}</p>
        <p><strong>Текст сообщения:</strong></p>
        <div class="border p-3 mb-3">{{ message.body|linebreaks }}</div>
    </div>
    <div class="card-footer">
        <a href="{% url 'mailing:message_update' message.pk %}" class="btn btn-warning">Редактировать</a>
        <a href="{% url 'mailing:message_delete' message.pk %}" class="btn btn-danger">Удалить</a>
        <a href="{% url 'mailing:message_list' %}" class="btn btn-secondary">Назад</a>
    </div>
</div>
{% endblock %}
